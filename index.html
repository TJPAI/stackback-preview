<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta name="stackback-build" content="bc8802996d6c55cb">
  <meta name="color-scheme" content="dark">
  <title>StackBack</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f9fc;background:#07111d;--card:#101d2c;--muted:#91a2b4;--green:#5ee49b;--line:#20334a}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111d,#0b1623);min-height:100vh}.app{max-width:680px;margin:0 auto;padding:22px 16px 48px}.hero{padding:26px 4px 14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--green)}h1{font-size:34px;line-height:1.08;margin:10px 0 12px}p{margin:0;line-height:1.55}.muted{color:var(--muted);font-size:14px}.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(16,29,44,.92);box-shadow:0 12px 34px rgba(0,0,0,.18)}.card-title{font-weight:850;font-size:18px;margin-bottom:7px}button,input{font:inherit}.primary,.secondary{border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--green);color:#062014}.secondary{border:1px solid #2c455f;background:#152537;color:#dce8f5}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}.city-row{display:flex;gap:8px;margin-top:10px}.search-row{display:flex;gap:8px;margin:10px 0}input{min-width:0;flex:1;border:1px solid #29425c;border-radius:13px;background:#0c1825;color:#f7f9fc;padding:12px 13px}input::placeholder{color:#6f8295}@media(max-width:520px){h1{font-size:30px}.search-row{flex-direction:column}.search-row .primary{width:100%}}
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script>
(() => {
  const local = document.querySelector('meta[name="stackback-build"]')?.content;
  if (!/^[a-f0-9]{16}$/.test(local || '')) return;
  fetch('./version.json?b=' + Date.now(), { cache: 'no-store' })
    .then(response => response.ok ? response.json() : null)
    .then(remote => {
      if (!remote || remote.schemaVersion !== 1 || !/^[a-f0-9]{16}$/.test(remote.buildId) || remote.buildId === local) return;
      const next = new URL(location.href);
      if (next.searchParams.get('v') === remote.buildId) return;
      next.searchParams.set('v', remote.buildId);
      location.replace(next.href);
    })
    .catch(() => {});
})();
</script>
  <script type="module" src="./assets/app.bc8802996d6c55cb.js"></script>
</body>
</html>
