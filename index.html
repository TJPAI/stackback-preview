  <style>

    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111d,#0b1623);min-height:100vh}.app{max-width:680px;margin:0 auto;padding:22px 16px 48px}.hero{padding:26px 4px 14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--green)}h1{font-size:34px;line-height:1.08;margin:10px 0 12px}p{margin:0;line-height:1.55}.muted{color:var(--muted);font-size:14px}.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(16,29,44,.92);box-shadow:0 12px 34px rgba(0,0,0,.18)}.card-title{font-weight:850;font-size:18px;margin-bottom:7px}button,input{font:inherit}.primary,.secondary{border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--green);color:#062014}.secondary{border:1px solid #2c455f;background:#152537;color:#dce8f5}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}.city-row{display:flex;gap:8px;margin-top:10px}.search-row{display:flex;gap:8px;margin:10px 0}input{min-width:0;flex:1;border:1px solid #29425c;border-radius:13px;background:#0c1825;color:#f7f9fc;padding:12px 13px}input::placeholder{color:#6f8295}a{color:var(--green);font-weight:800;text-decoration:none}a:hover{text-decoration:underline}.search-results{display:grid;gap:12px}.brand-result{padding-top:8px}.brand-name{display:block;font-size:20px;margin:4px 0 10px}.decision-card{border:1px solid rgba(94,228,155,.42);border-radius:17px;background:linear-gradient(180deg,rgba(21,53,49,.92),rgba(11,24,38,.94));padding:15px;margin:10px 0 14px}.decision-kicker{color:var(--green);font-size:12px;font-weight:900;letter-spacing:.08em}.decision-title{font-size:19px;font-weight:900;margin:4px 0 12px}.decision-grid{display:grid;gap:0;border-top:1px solid rgba(145,162,180,.18)}.decision-line{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid rgba(145,162,180,.14)}.decision-label{color:var(--muted);font-size:13px;font-weight:800}.decision-line strong{font-size:14px;line-height:1.45}.decision-savings{color:var(--green)}.decision-action{display:inline-flex;margin-top:13px;padding:10px 12px;border-radius:12px;background:var(--green);color:#062014}.section-heading{margin:14px 0 7px;font-weight:800}.result-card{padding:11px 12px;margin:7px 0;border:1px solid rgba(145,162,180,.16);border-radius:13px;background:rgba(11,24,38,.72)}.result-card strong{display:block;line-height:1.45}.result-card .muted{margin-top:4px}.result-card a{display:inline-block;margin-top:5px}.attribution{margin-top:7px;font-size:12px}.offer-results{margin-top:4px}@media(max-width:520px){h1{font-size:30px}.search-row{flex-direction:column}.search-row .primary{width:100%}.decision-line{grid-template-columns:72px minmax(0,1fr)}}
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script>
(() => {
  const local = document.querySelector('meta[name="stackback-build"]')?.content;
  if (!/^[a-f0-9]{16}$/.test(local || '')) return;
  fetch('./version.json?b=' + Date.now(), { cache: 'no-store' })
    .then(response => response.ok ? response.json() : null)
    .then(remote => {
      if (!remote || remote.schemaVersion !== 1 || !/^[a-f0-9]{16}$/.test(remote.buildId) || remote.buildId === local) return;
      const next = new URL(location.href);
      if (next.searchParams.get('v') === remote.buildId) return;
      next.searchParams.set('v', remote.buildId);
      location.replace(next.href);
    })
    .catch(() => {});
})();
</script>
  <script type="module" src="./assets/app.c7d07387916038db.js"></script>
</body>
