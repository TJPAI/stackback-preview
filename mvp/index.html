<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">
  <title>StackBack MVP</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <main class="shell">
    <div class="brandbar"><div class="logo">StackBack</div><div class="version">MVP · 0.1</div></div>
    <section class="hero">
      <h1>现在怎么买，最省？</h1>
      <p>告诉 StackBack 你现在想买什么。第一版先把最重要的一件事做通：基于当前位置找附近门店，并把真实官方优惠候选压成一个可执行下一步。</p>
    </section>

    <section class="location-card">
      <div class="location-copy">
        <div class="location-title">当前位置</div>
        <div class="location-status" data-role="location-status">尚未获取位置</div>
      </div>
      <button class="ghost-btn" type="button" data-action="locate">使用当前位置</button>
    </section>

    <form class="search-card" data-role="search-form">
      <div class="search-row">
        <input class="search-input" data-role="query" autocomplete="off" maxlength="80" placeholder="例如：麦当劳、星巴克、肯德基">
        <button class="primary-btn" data-action="search" type="submit" disabled>告诉我现在怎么买</button>
      </div>
      <div class="chips">
        <button class="chip" type="button" data-query="麦当劳">麦当劳</button>
        <button class="chip" type="button" data-query="肯德基">肯德基</button>
        <button class="chip" type="button" data-query="星巴克">星巴克</button>
      </div>
      <div class="note">附近门店来自 OpenStreetMap。官方优惠候选目前先覆盖中国区的麦当劳、肯德基和星巴克；Candidate ≠ Confirmed，金额与叠加关系不能确认就保持未知。</div>
    </form>

    <section class="results" data-role="results"></section>
    <div class="footer">MVP 目标不是展示更多 Coupon，而是先把“去哪 → 怎么省 → 是否可靠”做成一次真的能点、能查、能继续执行的体验。</div>
  </main>
  <script defer src="./assets/app.js"></script>
</body>
</html>
